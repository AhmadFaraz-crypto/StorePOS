name: Release

# Cut a release by pushing a version tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            args: --win --x64
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: --mac --arm64
          # Intel DMG cross-built on the Apple Silicon runner — GitHub's Intel
          # (macos-13) runners queue for a long time, so we don't depend on them.
          - os: macos-latest
            label: macOS (Intel)
            args: --mac --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Resolve fresh for the runner's platform (see ci.yml / npm/cli#4828).
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Compile app (main / preload / renderer)
        run: npm run build

      - name: Build installer
        env:
          # Unsigned build — skip hunting for an Apple Developer certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: ignore

  release:
    name: Publish draft release
    needs: build
    # Run even if one build fails, so a working installer still gets attached.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          append_body: true
          body: |
            ## Install

            These builds are **not code-signed** (StorePOS isn't on the App Store or
            Microsoft Store), so your OS warns on first launch. This is expected and
            safe — a couple of one-time steps and you're in.

            ### Windows
            1. Download the `…-setup.exe` from **Assets** below and run it.
            2. On the blue **"Windows protected your PC"** screen, click
               **More info → Run anyway**.

            ### macOS
            Pick the right file: **Apple menu →  About This Mac**. If it says
            *Apple M-series*, download the **arm64** `.dmg`; if *Intel*, the **x64** one.
            1. Open the `.dmg` and drag **StorePOS** into **Applications**.
            2. First launch only: in **Applications**, **right-click StorePOS → Open → Open**.
            3. If macOS says the app is **"damaged" or can't be opened**, run this once in
               **Terminal**, then open it again:
               ```sh
               xattr -cr /Applications/StorePOS.app
               ```
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
