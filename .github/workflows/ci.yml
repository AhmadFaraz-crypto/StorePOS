name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The committed lockfile is generated on macOS and can't carry Linux's
        # native optional deps (rollup binaries) or electron-builder's Windows
        # peer — a known npm limitation (npm/cli#4828). Resolve fresh for the
        # runner's own platform instead of a strict `npm ci`.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
